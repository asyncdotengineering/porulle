<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #fafaf4;
    }
  </style>

<body class="min-h-screen text-on-surface">
<!-- TopNavBar Implementation -->
<nav class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-[72px] bg-surface border-b border-outline-variant fixed top-0 left-0 z-50">
<div class="flex items-center gap-4">
<span class="text-headline-md font-headline-md tracking-tight text-on-surface">Acme Boutique</span>
</div>
<div class="flex items-center gap-6">
<div class="flex items-center gap-3 pr-4 border-r border-outline-variant">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high">
<img alt="Asha" class="w-full h-full object-cover" data-alt="A professional headshot of a boutique manager named Asha. She has a warm, friendly expression and is set against a clean, minimalist studio background with soft, high-key lighting. The overall aesthetic is modern and sophisticated, utilizing a palette of soft creams and muted tones to match a premium retail environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHjWbAFqoS3aZLU4ee3UIMklDJNxfw4sQCqL-drdio51ThOGxmFtJCMH_2lYhn4hxdmkiBAf9DtCrod1aWTbGsPCzvCFQNUec77LCitse3CVILc7JPFPF6W-BgAy1GH8I6ZA-dWlzFcuj3GEnnpMgBckKJsmjKRyTeOFE2GL2T34ouWEmQK-5trImACJi8XJ7ghXtwlKIKzS-IquhbGAtWqh_2GRDaYIwEab0cWhg6QsdKUIzT0NxtOqumfL2MKehWRp-81v41XLyI"/>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">Asha</span>
</div>
<div class="flex items-center gap-2">
<button class="w-hit-target h-hit-target flex items-center justify-center hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
<button class="w-hit-target h-hit-target flex items-center justify-center hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
</button>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="pt-[72px] min-h-screen flex items-center justify-center px-margin-mobile md:px-margin-desktop">
<!-- Open Till Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-8 md:p-12 max-w-xl w-full flex flex-col items-center text-center">
<!-- Icon Indicator -->
<div class="mb-6 w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[32px]" data-icon="point_of_sale">point_of_sale</span>
</div>
<!-- Typography Header -->
<h1 class="text-display-lg-mobile md:text-display-lg font-display-lg mb-4 text-on-surface">Open till for today's shift</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant mb-10">Count the cash drawer and declare the starting amount in LKR</p>
<!-- Numeric Input Section -->
<div class="w-full mb-8">
<label class="text-label-caps font-label-caps text-on-surface-variant mb-2 block text-left">Starting cash (LKR)</label>
<div class="flex items-center bg-surface-container border-b-2 border-on-surface h-[64px] px-4">
<button class="w-hit-target h-hit-target flex items-center justify-center hover:bg-surface-container-high rounded-full transition-all">
<span class="material-symbols-outlined text-primary" data-icon="remove">remove</span>
</button>
<input class="flex-1 bg-transparent border-none text-center text-headline-md font-headline-md focus:ring-0 focus:outline-none" readonly="" type="text" value="0.00"/>
<button class="w-hit-target h-hit-target flex items-center justify-center hover:bg-surface-container-high rounded-full transition-all">
<span class="material-symbols-outlined text-primary" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Quick Add Chips -->
<div class="flex flex-wrap justify-center gap-3 mb-8">
<button class="px-6 py-2 border border-outline-variant rounded-full text-label-caps font-label-caps text-on-surface hover:bg-surface-container-high transition-all active:scale-95">LKR 5,000</button>
<button class="px-6 py-2 border border-outline-variant rounded-full text-label-caps font-label-caps text-on-surface hover:bg-surface-container-high transition-all active:scale-95">LKR 10,000</button>
<button class="px-6 py-2 border border-outline-variant rounded-full text-label-caps font-label-caps text-on-surface hover:bg-surface-container-high transition-all active:scale-95">LKR 20,000</button>
<button class="px-6 py-2 border border-outline-variant rounded-full text-label-caps font-label-caps text-on-surface hover:bg-surface-container-high transition-all active:scale-95">LKR 50,000</button>
</div>
<!-- Helper Text -->
<div class="flex items-center gap-2 mb-10 text-on-surface-variant">
<span class="material-symbols-outlined text-body-sm" data-icon="info">info</span>
<span class="text-body-sm font-body-sm italic">Float will be reconciled at shift close.</span>
</div>
<!-- Action Cluster -->
<div class="w-full flex flex-col gap-4">
<button class="w-full h-hit-target bg-primary-container text-on-primary-fixed-variant font-bold rounded-full text-body-lg flex items-center justify-center hover:bg-primary transition-all hover:text-on-primary active:scale-95">
          Open Till
        </button>
<button class="w-full h-hit-target border border-outline-variant text-on-surface-variant font-bold rounded-full text-body-lg flex items-center justify-center hover:bg-surface-container-low transition-all active:scale-95">
          Cancel
        </button>
</div>
</div>
</main>
<!-- Optional SideNav (Contextual Check: Not rendered as this is a focused transactional screen) -->
</body></html>
