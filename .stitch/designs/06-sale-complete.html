<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#1a1c19",
                    "inverse-on-surface": "#f1f1eb",
                    "on-primary-fixed": "#002111",
                    "error-container": "#ffdad6",
                    "tertiary": "#6a5d42",
                    "surface-variant": "#e3e3dd",
                    "tertiary-container": "#ffebc9",
                    "on-primary-container": "#417657",
                    "inverse-surface": "#2f312d",
                    "on-tertiary-fixed-variant": "#52452d",
                    "secondary": "#456552",
                    "on-tertiary-fixed": "#241a06",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#9bd3ae",
                    "secondary-fixed-dim": "#abcfb7",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e3e3dd",
                    "surface-container-high": "#e8e8e3",
                    "on-secondary-fixed": "#002112",
                    "on-secondary-container": "#496a56",
                    "surface-dim": "#dadad5",
                    "tertiary-fixed": "#f4e0bf",
                    "secondary-fixed": "#c7ebd3",
                    "tertiary-fixed-dim": "#d7c4a4",
                    "on-background": "#1a1c19",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#717972",
                    "primary": "#34694b",
                    "on-primary-fixed-variant": "#1a5034",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c0c9c0",
                    "on-tertiary-container": "#78694e",
                    "surface-tint": "#34694b",
                    "surface-bright": "#fafaf4",
                    "secondary-container": "#c4e8d0",
                    "surface": "#fafaf4",
                    "surface-container": "#eeeee8",
                    "on-surface-variant": "#414942",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f4f4ee",
                    "inverse-primary": "#9bd3ae",
                    "on-secondary-fixed-variant": "#2d4d3b",
                    "primary-fixed": "#b6f0c9",
                    "primary-container": "#c1fbd4",
                    "on-secondary": "#ffffff",
                    "background": "#fafaf4"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "margin-desktop": "64px",
                    "hit-target": "44px",
                    "gutter": "16px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "display-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "display-lg-mobile": ["36px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "300"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "letterSpacing": "0em", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "300"}],
                    "headline-md": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface-container-low min-h-screen text-on-surface">
<!-- Top Navigation Anchor (Non-Top Level - Shell Logic Applied) -->
<header class="bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline flex justify-between items-center w-full px-margin-desktop h-hit-target">
<div class="font-display-lg text-display-lg text-primary dark:text-primary-fixed">Acme Boutique</div>
<div class="flex items-center gap-6">
<span class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant cursor-pointer active:scale-95 duration-200 hover:bg-surface-container transition-colors p-2 rounded-full">assignment_return</span>
<span class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant cursor-pointer active:scale-95 duration-200 hover:bg-surface-container transition-colors p-2 rounded-full">dark_mode</span>
<span class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant cursor-pointer active:scale-95 duration-200 hover:bg-surface-container transition-colors p-2 rounded-full">logout</span>
<img alt="Cashier Asha" class="w-8 h-8 rounded-full border border-outline-variant" data-alt="A professional headshot of a friendly female retail professional in a high-end boutique setting. The lighting is soft and flattering, emphasizing a bright, welcoming light-mode atmosphere. She has a warm expression, perfectly capturing the premium service of Acme Boutique. The background is a slightly blurred cream and mint luxury interior, consistent with a modern corporate and minimalist design aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZPEsDr2W6luy7fKb-DlJ3XsDAnXFV3JpgwFApqNEzPwkH_VvgQCKQ9Y7-XFpbnWzcmZetfQaZb4znXGrE_x91H5O6QzNlpAq-e9ChaLuSIy415wfByndFtBM6NQVACsduXL8lH_CkZXIGulgEMtUcTjkdBqS0KaHJOpcHa5IEGIL3wbxzysMiFVyyaxQ8BoHSUasLG-xQ8_zmgKSokc0ZmAQKNCBZocc7BNTup3uCzmGQZ-1Qj0ShzaM6ury-bMTDQvu0Uye2MWhp"/>
</div>
</header>
<main class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-12 flex flex-col items-center">
<!-- Header Section -->
<div class="flex flex-col items-center text-center mb-10">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Sale complete</h1>
<p class="font-headline-md text-headline-md text-primary">Change LKR 600 — hand to customer</p>
</div>
<!-- Receipt Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg border border-outline-variant p-8 mb-10 shadow-sm">
<div class="text-center mb-8">
<h2 class="font-label-caps text-label-caps tracking-[0.2em] text-on-surface-variant mb-1">Acme Boutique</h2>
<p class="font-body-sm text-body-sm text-outline">Oct 24, 2023 · 02:45 PM</p>
</div>
<div class="space-y-4 mb-8">
<div class="flex justify-between items-start">
<span class="font-body-lg text-body-lg text-on-surface">Evening Silk Slip</span>
<span class="font-body-lg text-body-lg text-on-surface">LKR 12,400</span>
</div>
</div>
<div class="border-t border-dashed border-outline-variant pt-6 space-y-3">
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
<span>Subtotal</span>
<span>LKR 11,800</span>
</div>
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
<span>Tax (5%)</span>
<span>LKR 600</span>
</div>
<div class="flex justify-between font-bold text-headline-md text-on-surface pt-2">
<span>Total</span>
<span>LKR 12,400</span>
</div>
</div>
<div class="text-center mt-10">
<p class="font-body-sm text-body-sm italic text-outline">Thank you for shopping with us!</p>
</div>
</div>
<!-- Interaction: Send Receipt -->
<div class="w-full max-w-md mb-16">
<h3 class="font-label-caps text-label-caps text-center text-outline mb-6">SEND RECEIPT</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<button class="h-hit-target rounded-full border border-outline-variant text-on-surface font-label-caps text-label-caps hover:bg-surface-container transition-colors active:scale-95 duration-200">Email</button>
<button class="h-hit-target rounded-full border border-outline-variant text-on-surface font-label-caps text-label-caps hover:bg-surface-container transition-colors active:scale-95 duration-200">SMS</button>
<button class="h-hit-target rounded-full border border-outline-variant text-on-surface font-label-caps text-label-caps hover:bg-surface-container transition-colors active:scale-95 duration-200">Print</button>
<button class="h-hit-target rounded-full border border-outline-variant text-on-surface font-label-caps text-label-caps hover:bg-surface-container transition-colors active:scale-95 duration-200">None</button>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-center items-center px-margin-desktop h-24 bg-surface-container-low border-t border-outline-variant">
<div class="max-w-[1280px] w-full flex justify-end gap-gutter">
<!-- As per JSON logic for BottomNavBar mapping -->
<button class="border border-outline-variant text-on-surface rounded-full px-gutter py-2 font-label-caps text-label-caps hover:opacity-90 active:scale-98 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
                Cancel Sale
            </button>
<button class="border border-outline-variant text-on-surface rounded-full px-gutter py-2 font-label-caps text-label-caps hover:opacity-90 active:scale-98 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="pause">pause</span>
                Hold Sale
            </button>
<button class="bg-primary text-on-primary rounded-full px-gutter py-4 font-label-caps text-label-caps hover:opacity-90 active:scale-98 transition-all flex items-center justify-center gap-2 min-w-[240px]">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
                NEW SALE
            </button>
</div>
</div>
</body></html>
