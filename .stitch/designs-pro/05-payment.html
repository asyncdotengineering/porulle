<!-- TopAppBar Shared Component -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-lg py-md h-[64px] bg-background border-b border-outline-variant">
<div class="flex items-center gap-md pl-[280px]"> <!-- Adjusted for SideNav -->
<span class="text-headline-sm font-headline-sm font-bold text-on-surface">Lumiere POS</span>
</div>
<div class="flex items-center gap-md">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="wifi">wifi</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="power_settings_new">power_settings_new</span>
</button>
</div>
</header>

<nav class="fixed left-0 top-0 h-full w-[280px] z-40 flex flex-col pt-[80px] pb-lg bg-surface-container-low border-r border-outline-variant">
<div class="px-md mb-lg">
<div class="flex items-center gap-sm px-sm">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-outline" data-icon="store">store</span>
</div>
<div>
<h2 class="font-label-md text-label-md text-on-surface">Main Street Boutique</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Terminal 01</p>
</div>
</div>
</div>
<div class="flex-1 overflow-y-auto">
<ul class="flex flex-col">

<li>
<a class="bg-primary-container text-on-primary-container rounded-full mx-md my-xs px-md py-sm flex items-center gap-md opacity-80 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="point_of_sale" data-weight="fill" style="font-variation-settings: 'FILL' 1;">point_of_sale</span>

</a>
</li>
<!-- Inactive Nav Items -->
<li>
<a class="text-on-surface-variant mx-md my-xs px-md py-sm hover:bg-secondary-container transition-all flex items-center gap-md rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md text-on-surface-variant">Orders</span>
</a>
</li>
<li>
<a class="text-on-surface-variant mx-md my-xs px-md py-sm hover:bg-secondary-container transition-all flex items-center gap-md rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>

</a>
</li>
<li>
<a class="text-on-surface-variant mx-md my-xs px-md py-sm hover:bg-secondary-container transition-all flex items-center gap-md rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-md text-label-md text-on-surface-variant">Reports</span>
</a>
</li>
</ul>

<div class="mt-auto">
<ul>
<li>
<a class="text-on-surface-variant mx-md my-xs px-md py-sm hover:bg-secondary-container transition-all flex items-center gap-md rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
<span class="font-label-md text-label-md text-on-surface-variant">Help</span>
</a>
</li>
</ul>

<!-- Main Canvas -->
<main class="ml-[280px] pt-[64px] flex-1 h-screen overflow-y-auto p-margin-tablet">
<div class="max-w-[1200px] mx-auto h-full flex flex-col md:flex-row gap-lg">
<!-- Left Column: Summary & Total Display (Bento Style) -->
<div class="flex-1 flex flex-col gap-md">
<!-- Primary Total Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl flex flex-col items-center justify-center flex-1 relative overflow-hidden">
<!-- Subtle background graphic for premium feel -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(circle at 50% 0%, #34694b 0%, transparent 70%);"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-sm relative z-10">Total Due</span>
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tight relative z-10">LKR 12,400</h1>
<div class="mt-lg w-full max-w-sm border-t border-outline-variant pt-md relative z-10">
<div class="flex justify-between items-center mb-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal</span>
<span class="font-body-md text-body-md text-on-surface">LKR 11,500</span>
</div>
<div class="flex justify-between items-center mb-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Tax (8%)</span>

</div>
</div>
</div>

<span class="font-label-md text-label-md text-primary">Cash</span>
</button>

<span class="font-label-md text-label-md text-on-surface-variant">Card</span>
</button>
<button class="flex-1 py-md flex flex-col items-center justify-center gap-xs border-b-[3px] border-transparent hover:bg-surface-container-lowest transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="call_split">call_split</span>
<span class="font-label-md text-label-md text-on-surface-variant">Split</span>

<span class="font-headline-sm text-headline-sm text-on-surface-variant pl-sm">LKR</span>
<input class="w-full bg-transparent border-none text-right font-headline-sm text-headline-sm text-on-surface focus:ring-0 p-0 m-0" readonly="" type="text" value="15,000"/>
</div>
<div class="flex justify-between items-center mt-sm px-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Change Due</span>
<span class="font-headline-sm text-headline-sm text-primary">LKR 2,600</span>
</div>

<div class="grid grid-cols-4 gap-sm mb-lg">
<button class="bg-surface-container-low border border-outline-variant rounded-full py-sm px-xs font-label-md text-label-md text-on-surface hover:bg-secondary-container transition-colors">+500</button>
<button class="bg-surface-container-low border border-outline-variant rounded-full py-sm px-xs font-label-md text-label-md text-on-surface hover:bg-secondary-container transition-colors">+1,000</button>
<button class="bg-surface-container-low border border-outline-variant rounded-full py-sm px-xs font-label-md text-label-md text-on-surface hover:bg-secondary-container transition-colors">+2,000</button>
<button class="bg-surface-container-low border border-outline-variant rounded-full py-sm px-xs font-label-md text-label-md text-on-surface hover:bg-secondary-container transition-colors">+5,000</button>
</div>

<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">1</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">2</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">3</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">4</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">5</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">6</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">7</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">8</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">9</button>
<button class="bg-surface-container-low border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-sm text-headline-sm text-on-surface-variant active:bg-surface-variant hover:border-outline transition-colors">C</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-lg text-headline-lg text-on-surface active:bg-surface-container-low hover:border-outline transition-colors">0</button>
<button class="bg-surface-container-low border border-outline-variant rounded-full h-[64px] flex items-center justify-center font-headline-sm text-headline-sm text-on-surface-variant active:bg-surface-variant hover:border-outline transition-colors">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>

<button class="mt-lg w-full bg-primary-container text-on-primary-fixed rounded-full h-[64px] flex items-center justify-center font-label-md text-label-md uppercase tracking-wider hover:opacity-90 transition-opacity">

</div>
