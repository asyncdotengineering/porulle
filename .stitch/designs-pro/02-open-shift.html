<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumiere POS - Open Shift</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#496a56",
                        "on-background": "#1a1c1e",
                        "surface-container-high": "#e8e8eb",
                        "primary-container": "#c1fbd4",
                        "on-primary-container": "#417657",
                        "surface-variant": "#e2e2e5",
                        "background": "#f9f9fc",
                        "on-surface": "#1a1c1e",
                        "surface-dim": "#dadadd",
                        "on-primary-fixed-variant": "#1a5034",
                        "tertiary": "#5d5f5a",
                        "surface-tint": "#34694b",
                        "surface": "#f9f9fc",
                        "tertiary-fixed": "#e3e3dd",
                        "inverse-primary": "#9bd3ae",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#414942",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#717972",
                        "secondary-fixed-dim": "#abcfb7",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#b6f0c9",
                        "surface-container-highest": "#e2e2e5",
                        "on-tertiary-container": "#6a6c67",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c0c9c0",
                        "inverse-on-surface": "#f0f0f3",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#464743",
                        "secondary": "#456552",
                        "surface-bright": "#f9f9fc",
                        "secondary-fixed": "#c7ebd3",
                        "inverse-surface": "#2f3033",
                        "surface-container": "#eeedf0",
                        "primary-fixed-dim": "#9bd3ae",
                        "primary": "#34694b",
                        "on-primary-fixed": "#002111",
                        "tertiary-container": "#eeeee8",
                        "on-secondary-fixed-variant": "#2d4d3b",
                        "secondary-container": "#c4e8d0",
                        "tertiary-fixed-dim": "#c6c7c1",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f3f3f6",
                        "on-tertiary-fixed": "#1a1c19",
                        "on-secondary-fixed": "#002112"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "margin-tablet": "32px",
                        "md": "16px",
                        "unit": "4px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "xl": "40px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "300" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "letterSpacing": "0em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "display-md": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "300" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Modern Merchant Tonal Layering */
        body { background-color: #fbfbf5; }
        .card-layer { background-color: #ffffff; border: 1px solid #e4e4e7; }
        .hairline-border { border: 1px solid #e4e4e7; }
        .mint-pill { background-color: #c1fbd4; color: #000000; }
        .pistachio-tint { background-color: #d4f9e0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-tablet font-body-md text-on-surface">
<!-- Intent: Transactional/Onboarding screen. Navigation shell suppressed per Semantic Shell Mandate -->
<main class="w-full max-w-[560px]">
<!-- Brand Header Context -->
<div class="text-center mb-xl">
<h1 class="font-display-md text-display-md text-on-surface mb-xs tracking-tight">Lumiere POS</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Main Street Boutique</p>
</div>
<!-- Open Shift Card -->
<div class="card-layer rounded-xl p-xl flex flex-col gap-lg shadow-sm">
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Open till for today's shift</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Verify starting cash to begin processing transactions.</p>
</div>
<!-- Input Area -->
<div class="flex flex-col gap-md mt-md">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Starting cash LKR</label>
<div class="flex items-center justify-between hairline-border rounded-full p-xs h-[72px] bg-surface-container-lowest">
<button aria-label="Decrease amount" class="h-[56px] w-[56px] rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined text-[28px]">remove</span>
</button>
<div class="flex-1 flex justify-center items-center">
<span class="font-headline-sm text-headline-sm text-on-surface-variant mr-xs">LKR</span>
<input aria-label="Amount input" class="w-full text-center font-display-md text-display-md text-on-surface bg-transparent border-none focus:ring-0 p-0" type="text" value="0.00"/>
</div>
<button aria-label="Increase amount" class="h-[56px] w-[56px] rounded-full flex items-center justify-center hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
</div>
</div>
<!-- Quick Add Chips -->
<div class="flex flex-wrap gap-sm justify-center py-sm">
<button class="hairline-border rounded-full px-lg py-md font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px]">
                    + 5,000
                </button>
<button class="hairline-border rounded-full px-lg py-md font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px]">
                    + 10,000
                </button>
<button class="hairline-border rounded-full px-lg py-md font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px]">
                    + 20,000
                </button>
<button class="hairline-border rounded-full px-lg py-md font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px]">
                    + 50,000
                </button>
</div>
<!-- Primary Action -->
<div class="mt-md pt-lg border-t border-outline-variant/30 flex flex-col gap-md">
<button class="mint-pill w-full rounded-full min-h-[64px] flex items-center justify-center gap-sm hover:opacity-90 transition-opacity">
<span class="font-label-md text-label-md text-black uppercase tracking-wider">Open Till</span>
<span class="material-symbols-outlined text-black">arrow_forward</span>
</button>
<button class="w-full min-h-[48px] rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[18px]">lock_reset</span>
                    Switch User
                </button>
</div>
</div>
</main>
</body></html>
