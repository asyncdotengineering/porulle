<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>POS Cash Payment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e8e8eb",
                        "on-secondary-fixed-variant": "#2d4d3b",
                        "background": "#f9f9fc",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9fc",
                        "on-primary-container": "#417657",
                        "primary-fixed-dim": "#9bd3ae",
                        "on-primary-fixed-variant": "#1a5034",
                        "inverse-primary": "#9bd3ae",
                        "tertiary-container": "#eeeee8",
                        "tertiary": "#5d5f5a",
                        "on-tertiary-fixed-variant": "#464743",
                        "surface-variant": "#e2e2e5",
                        "on-tertiary-fixed": "#1a1c19",
                        "outline-variant": "#c0c9c0",
                        "surface-dim": "#dadadd",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2f3033",
                        "surface-container": "#eeedf0",
                        "outline": "#717972",
                        "on-error-container": "#93000a",
                        "on-background": "#1a1c1e",
                        "on-surface-variant": "#414942",
                        "primary-container": "#c1fbd4",
                        "surface-container-highest": "#e2e2e5",
                        "on-secondary-fixed": "#002112",
                        "on-primary-fixed": "#002111",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-container-low": "#f3f3f6",
                        "on-surface": "#1a1c1e",
                        "secondary-container": "#c4e8d0",
                        "secondary": "#456552",
                        "on-secondary-container": "#496a56",
                        "on-primary": "#ffffff",
                        "surface": "#f9f9fc",
                        "tertiary-fixed": "#e3e3dd",
                        "secondary-fixed-dim": "#abcfb7",
                        "secondary-fixed": "#c7ebd3",
                        "surface-tint": "#34694b",
                        "tertiary-fixed-dim": "#c6c7c1",
                        "primary": "#34694b",
                        "primary-fixed": "#b6f0c9",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#6a6c67"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "unit": "4px",
                        "sm": "8px",
                        "gutter": "16px",
                        "margin-tablet": "32px",
                        "xs": "4px",
                        "xl": "40px",
                        "margin-mobile": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "display-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "letterSpacing": "0em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "300" }],
                        "display-md": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "300" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "letterSpacing": "0em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:flex-row antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Mobile Only) / SideNavBar (Desktop) Suppressed as this is a transactional screen (Checkout/Payment) -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col md:flex-row w-full max-w-[1200px] mx-auto min-h-screen">
<!-- Header / Close Action -->
<header class="w-full flex items-center justify-between p-md md:p-lg md:absolute md:top-0 md:left-0 md:right-0 z-10 md:bg-transparent">
<button aria-label="Close Payment" class="flex items-center justify-center w-12 h-12 rounded-full border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Payment</h1>
<div class="w-12 h-12"></div> <!-- Spacer for flex balance -->
</header>
<!-- Left Side: Order Summary -->
<section class="w-full md:w-1/3 flex flex-col bg-surface p-md md:p-margin-tablet pt-[80px] md:pt-[100px] border-b md:border-b-0 md:border-r border-outline-variant">
<div class="flex-1 flex flex-col max-w-sm mx-auto w-full">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-lg">Order Summary</h2>
<div class="flex-1 flex flex-col gap-sm overflow-y-auto mb-lg pr-sm">
<!-- Sample Items -->
<div class="flex justify-between items-start py-sm border-b border-outline-variant">
<div>
<p class="font-body-md text-body-md text-on-surface">Silk Scarf - Ivory</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Qty: 1</p>
</div>
<p class="font-body-md text-body-md text-on-surface">LKR 4,500</p>
</div>
<div class="flex justify-between items-start py-sm border-b border-outline-variant">
<div>
<p class="font-body-md text-body-md text-on-surface">Ceramic Vase - Tall</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Qty: 1</p>
</div>
<p class="font-body-md text-body-md text-on-surface">LKR 7,200</p>
</div>
</div>
<div class="space-y-sm pt-md border-t border-outline-variant">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Subtotal</span>
<span class="font-body-md text-body-md">LKR 11,700</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-body-md text-body-md">Tax (8%)</span>
<span class="font-body-md text-body-md">LKR 700</span>
</div>
<div class="flex justify-between items-center pt-md mt-sm border-t border-outline-variant text-on-surface">
<span class="font-headline-lg text-headline-lg">Total Due</span>
<span class="font-display-md text-display-md text-primary">LKR 12,400</span>
</div>
</div>
</div>
</section>
<!-- Right Side: Payment Interaction -->
<section class="w-full md:w-2/3 flex flex-col bg-background p-md md:p-margin-tablet pt-lg md:pt-[100px]">
<div class="max-w-lg mx-auto w-full flex flex-col h-full">
<!-- Payment Method Tabs -->
<div class="flex p-unit bg-surface-container-low rounded-full mb-xl border border-outline-variant">
<button class="flex-1 py-sm px-md rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md shadow-sm transition-all text-center">Cash</button>
<button class="flex-1 py-sm px-md rounded-full text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors text-center">Card</button>
<button class="flex-1 py-sm px-md rounded-full text-on-surface-variant font-label-md text-label-md hover:bg-surface-container transition-colors text-center">Split</button>
</div>
<!-- Amount Tendered Input -->
<div class="mb-lg">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-sm">Amount Tendered</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-headline-lg text-headline-lg text-on-surface-variant">LKR</span>
<input class="w-full h-16 pl-xl pr-md rounded-full border border-outline-variant bg-surface-container-lowest font-display-md text-display-md text-right text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" readonly="" type="text" value="15,000"/>
</div>
<div class="flex justify-between items-center mt-sm px-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Change Due</span>
<span class="font-headline-sm text-headline-sm text-on-surface">LKR 2,600</span>
</div>
</div>
<!-- Quick Cash Buttons -->
<div class="grid grid-cols-4 gap-sm mb-xl">
<button class="h-12 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">+500</button>
<button class="h-12 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">+1,000</button>
<button class="h-12 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">+2,000</button>
<button class="h-12 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">+5,000</button>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-sm mb-xl flex-1 content-start">
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">1</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">2</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">3</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">4</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">5</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">6</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">7</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">8</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">9</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors">C</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-lowest text-on-surface font-headline-lg text-headline-lg hover:bg-surface-container-low transition-colors">0</button>
<button class="h-16 rounded-full border border-outline-variant bg-surface-container-low text-on-surface-variant flex items-center justify-center hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Confirm Action -->
<div class="mt-auto pt-md">
<button class="w-full h-16 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center justify-center gap-sm">
                        CONFIRM PAYMENT
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</div>
</section>
</main>
</body></html>
